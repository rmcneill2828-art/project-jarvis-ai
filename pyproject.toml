[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS AI Platform"
requires-python = ">=3.12"
dependencies = [
    "psutil>=6.0",
    "piper-tts>=1.6.0,<2.0",
    "faster-whisper>=1.2.1,<2.0",
    # Kokoro (EBG-0125, EIP-ESR0053-002): Guardian's production speech-output
    # provider as of this addition, replacing Piper. Promoted here from the
    # now-removed evaluation-only `voice-eval` optional group once the live
    # listening comparison it existed for favoured adoption. `piper-tts`
    # above remains a base dependency unchanged - sentinel/piper_provider.py
    # is unregistered from production, not removed, so it stays buildable.
    "kokoro-onnx>=0.6.1,<1.0",
    "espeakng-loader>=0.2.4,<1.0",
    "phonemizer-fork>=3.3.2,<4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["jarvis/tests", "scripts/tests"]
pythonpath = ["."]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pip-audit",
    "pyinstaller>=6.21",
]

[project.scripts]
jarvis = "jarvis.app:main"

[tool.setuptools.packages.find]
include = ["jarvis", "jarvis.*", "sentinel", "sentinel.*"]