version: 2
updates:
  # Python (jarvis/, sentinel/, scripts/) - pyproject.toml at repository root.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # Frontend Guardian Desktop Platform Shell (src/) - package.json at repository root.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # React 19 waits until after go-live (ESR-0062 WP1, Programme Sponsor
      # decision D-2): a major upgrade would re-open the redesigned views.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # Tauri/Rust shell (src-tauri/).
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    ignore:
      # The direct indexmap 1.9 dependency only switches on indexmap 1.x's
      # "std" feature for schemars 0.8 (see Cargo.toml); 2.x would not reach it.
      - dependency-name: "indexmap"
        update-types: ["version-update:semver-major"]
      # windows-sys follows the version Tauri's own crates use (see
      # Cargo.toml); a 0.x minor is a breaking change, moved by hand.
      - dependency-name: "windows-sys"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # CI workflow definitions (.github/workflows/).
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
