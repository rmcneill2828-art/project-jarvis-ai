name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: ruff check .
      # Fails if pyproject.toml/package.json/src-tauri/Cargo.toml/
      # src-tauri/tauri.conf.json drift from VERSION (EIP-ESR0032-003).
      # No pre-existing drift to triage - blocking from introduction.
      - run: python scripts/sync_product_version.py --check
      - run: pytest -q
      - run: python scripts/validate_repository.py
      # Hard gate (EBG-0124, ESR-0052 WP1): the initial findings baseline this
      # step was waiting on has since been triaged (WR-ESR0052-001) - a real
      # pip-itself advisory (PYSEC-2026-3721), not a project dependency.
      - run: pip-audit

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      # --omit=dev: vite/esbuild (the only two current findings) are
      # build-tool devDependencies never present in the shipped `dist/`
      # bundle - their advisories (GHSA-67mh-4wv8-2f99, GHSA-fx2h-pf6j-xcff)
      # describe attacks on a locally running `vite dev` server, not the
      # packaged app. `npm audit --omit=dev` confirmed 0 vulnerabilities
      # against the real shipped dependency set (EIP-ESR0032-002), so this
      # is a real hard gate, not an advisory placeholder.
      - run: npm audit --audit-level=high --omit=dev

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Tauri's own documented Linux build prerequisites (EIP-ESR0032-002,
      # verified via a real WSL Ubuntu build before this job was written).
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev \
            libgtk-3-dev librsvg2-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev patchelf
      # Pinned to a commit SHA rather than the @stable branch ref (EBG-0087,
      # ESR-0033 WP4, OpenSSF-recommended Actions hardening) - the "stable"
      # Rust toolchain channel is still selected via the explicit `toolchain`
      # input below, resolved by rustup at runtime, so this pin hardens the
      # Action's own supply chain without freezing which Rust version CI
      # builds against. Bump this SHA periodically to pick up Action fixes.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      # Tauri's generate_context!() macro requires the externalBin sidecar
      # to exist at compile time regardless of build profile - a plain
      # `cargo build`/`clippy`/`test` fails without it, not just `tauri build`.
      - run: python scripts/build_backend_sidecar.py
      - run: cargo build --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
