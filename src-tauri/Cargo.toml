[package]
name = "jarvis-guardian-shell"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Forces indexmap's "std" feature on for schemars 0.8.22 (pulled in
# transitively via tauri-build/tauri-utils/tauri-plugin's Linux/dbus
# capability-schema generation). schemars 0.8.22 requests indexmap's
# "serde-1" feature but never "std", and indexmap 1.9.x has no default
# features at all - without "std", indexmap's own `#[cfg(has_std)]`
# split compiles IndexMap<K, V, S> with no default for S, breaking
# schemars's `type Map<K, V> = indexmap::IndexMap<K, V>;` alias. Only
# ever surfaces on Linux builds, since Windows never exercises this
# schemars code path at all - found and root-caused via a real WSL
# Ubuntu build (EIP-ESR0032-002).
indexmap = { version = "2.14", features = ["std"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync"] }
serde_json = "1"

# Backend process-tree termination (EBG-0154, EIP-ESR0060-002): a job object
# per backend. Already compiled into every Windows build through Tauri, so no
# new crate - pinned to 0.60 to reuse that copy. Win32_Security is needed only
# because windows-sys gates CreateJobObjectW's signature on it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[lib]
name = "jarvis_guardian_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "jarvis-guardian-shell"
path = "src/main.rs"
