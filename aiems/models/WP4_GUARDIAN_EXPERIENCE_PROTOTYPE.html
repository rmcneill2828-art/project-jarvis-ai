<title>Guardian Experience Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: a Guardian-centred app shell. A left rail switches views; the Guardian view puts the presence Orb
   above a conversation that scrolls inside its own pane, with the composer pinned at the bottom so it is never
   below the fold. Deliberately a single dark look (the Obsidian reference), so every colour is set explicitly. */
:root {
  --bg: #07080d;
  --bg-raised: #0c0f17;
  --bg-panel: #11151f;
  --bg-input: #0a0c13;
  --line: rgba(150, 165, 255, 0.14);
  --line-strong: rgba(150, 165, 255, 0.3);
  --fg: #e9edf6;
  --fg-muted: #9aa6bd;
  --cyan: #41e0f0;
  --violet: #8f7bff;
  --amber: #ffc46b;
  --green: #53e0a0;
  --red: #ff6b7a;
  --font-ui: "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 14px/1.5 var(--font-ui);
  overflow: hidden;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: 212px minmax(0, 1fr);
  grid-template-rows: 56px minmax(0, 1fr);
  grid-template-areas: "top top" "rail main";
  background:
    radial-gradient(900px 520px at 62% 8%, rgba(95, 80, 255, 0.1), transparent 70%),
    radial-gradient(700px 480px at 18% 100%, rgba(65, 224, 240, 0.06), transparent 70%),
    var(--bg);
}

/* ---- top bar ---- */
.topbar {
  grid-area: top;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 20px;
  border-bottom: 1px solid var(--line);
  background: rgba(7, 8, 13, 0.7);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 0.14em; font-size: 15px; min-width: 172px; }
.brand-mark { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 40% 38%, #fff 0 8%, var(--cyan) 22%, var(--violet) 62%, transparent 72%); box-shadow: 0 0 18px rgba(143, 123, 255, 0.55); }
.status-chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border: 1px solid var(--line-strong); border-radius: 999px; font-size: 12.5px; color: var(--fg); background: var(--bg-raised); }
.status-chip svg { width: 14px; height: 14px; }
.spacer { flex: 1; }
.profile-btn { display: flex; align-items: center; gap: 10px; padding: 5px 12px 5px 6px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg-raised); cursor: pointer; }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; background: linear-gradient(135deg, var(--violet), var(--cyan)); color: #07080d; }
.profile-text { text-align: left; line-height: 1.2; }
.profile-text small { display: block; color: var(--fg-muted); font-size: 11.5px; }

/* ---- rail ---- */
.rail { grid-area: rail; border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; background: rgba(7, 8, 13, 0.4); }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid transparent; border-radius: 10px; background: none; cursor: pointer; color: var(--fg-muted); text-align: left; width: 100%; }
.nav-item svg { width: 18px; height: 18px; flex: none; }
.nav-item:hover { color: var(--fg); background: rgba(150, 165, 255, 0.07); }
.nav-item[aria-current="page"] { color: var(--fg); background: rgba(143, 123, 255, 0.14); border-color: var(--line-strong); }
.rail-foot { margin-top: auto; color: var(--fg-muted); font-size: 12px; padding: 10px 12px; border-top: 1px solid var(--line); }

/* ---- main ---- */
main { grid-area: main; min-height: 0; min-width: 0; position: relative; }
.view { height: 100%; min-height: 0; }
.view[hidden] { display: none; }
.scroll { height: 100%; overflow: auto; padding: 24px 28px; }
h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: 0.01em; }
h2 { font-size: 13px; margin: 0 0 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-muted); font-weight: 600; }
.lede { color: var(--fg-muted); margin: 0 0 20px; max-width: 62ch; }
.card { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.row { display: flex; align-items: center; gap: 10px; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.mono { font-family: var(--font-mono); font-size: 12.5px; }
.muted { color: var(--fg-muted); }
.btn { padding: 7px 14px; border: 1px solid var(--line-strong); border-radius: 9px; background: rgba(143, 123, 255, 0.12); cursor: pointer; }
.btn:hover:not(:disabled) { background: rgba(143, 123, 255, 0.24); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: linear-gradient(135deg, rgba(143, 123, 255, 0.55), rgba(65, 224, 240, 0.4)); border-color: rgba(65, 224, 240, 0.5); }
.note { font-size: 12.5px; color: var(--fg-muted); margin: 8px 0 0; }

/* semantic state: icon + word, never colour alone */
.state { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; }
.state svg { width: 14px; height: 14px; }
.state.ready { color: var(--green); }
.state.preparing { color: var(--amber); }
.state.none { color: var(--fg-muted); }
.state.offline { color: var(--red); }
.state.unknown { color: var(--violet); }

/* ---- Guardian view ---- */
.guardian-layout { display: grid; grid-template-columns: minmax(0, 1fr) 270px; height: 100%; min-height: 0; }
.stage { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; min-width: 0; }
.orb-zone { display: grid; justify-items: center; padding: 14px 16px 4px; gap: 4px; }
.orb-wrap { width: clamp(150px, 26vh, 240px); aspect-ratio: 1; }
canvas#orb { width: 100%; height: 100%; display: block; }
.orb-state { font-weight: 700; letter-spacing: 0.06em; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
.orb-sub { color: var(--fg-muted); font-size: 12.5px; margin: 0; text-align: center; max-width: 54ch; min-height: 19px; }
.log { overflow: auto; padding: 8px 28px 8px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.msg { max-width: min(640px, 88%); padding: 10px 14px; border-radius: 14px; line-height: 1.5; }
.msg.user { align-self: flex-end; background: rgba(65, 224, 240, 0.1); border: 1px solid rgba(65, 224, 240, 0.2); }
.msg.guardian { align-self: flex-start; background: var(--bg-panel); border: 1px solid var(--line); }
.msg-meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 11.5px; color: var(--fg-muted); }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line-strong); font-size: 11.5px; font-weight: 600; }
.badge.local { color: var(--cyan); border-color: rgba(65, 224, 240, 0.4); }
.badge.claude { color: var(--amber); border-color: rgba(255, 196, 107, 0.5); background: rgba(255, 196, 107, 0.08); }
.icon-btn { border: 0; background: none; padding: 2px; cursor: pointer; color: var(--fg-muted); border-radius: 6px; display: inline-grid; }
.icon-btn:hover { color: var(--fg); background: rgba(150, 165, 255, 0.12); }
.icon-btn svg { width: 15px; height: 15px; }
.banner { margin: 0 28px 6px; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--bg-raised); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px; }
.banner.offline { border-color: rgba(255, 107, 122, 0.5); }
.banner.offer { border-color: rgba(255, 196, 107, 0.5); }
.composer-zone { padding: 6px 28px 14px; }
.disclosure { color: var(--fg-muted); font-size: 12px; margin: 0 0 6px 4px; display: flex; align-items: center; gap: 6px; }
.disclosure svg { width: 13px; height: 13px; }
.composer { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; border-radius: 16px; border: 1px solid var(--line-strong); background: var(--bg-input); }
.composer:focus-within { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(65, 224, 240, 0.14); }
.composer input { flex: 1; min-width: 0; background: none; border: 0; color: var(--fg); font: inherit; padding: 8px 0; }
.composer input:focus-visible { outline: none; }
.composer input::placeholder { color: var(--fg-muted); }
.tool { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-raised); display: grid; place-items: center; cursor: pointer; }
.tool svg { width: 18px; height: 18px; }
.tool:hover:not(:disabled) { border-color: var(--line-strong); }
.tool:disabled { opacity: 0.4; cursor: not-allowed; }
.tool.recording { color: var(--green); border-color: var(--green); }
.tool.send { background: linear-gradient(135deg, var(--violet), var(--cyan)); color: #07080d; border: 0; }
.claude-link { height: 38px; padding: 0 12px; border-radius: 12px; border: 1px solid rgba(255, 196, 107, 0.45); background: rgba(255, 196, 107, 0.07); color: var(--amber); cursor: pointer; font-weight: 600; font-size: 12.5px; }
.claude-link:disabled { opacity: 0.4; cursor: not-allowed; }

.side { border-left: 1px solid var(--line); padding: 20px 18px; overflow: auto; background: rgba(7, 8, 13, 0.35); }
.cap { padding: 8px 0; border-bottom: 1px solid var(--line); }
.cap:last-child { border-bottom: 0; }
.cap-name { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.cap small { display: block; color: var(--fg-muted); font-size: 12px; margin-top: 2px; }

/* ---- dialog ---- */
.backdrop { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(0, 0, 0, 0.62); padding: 16px; }
.dialog { max-width: 500px; width: 100%; background: var(--bg-panel); border: 1px solid rgba(255, 196, 107, 0.45); border-radius: 16px; padding: 22px; }
.dialog h2 { text-transform: none; letter-spacing: 0; font-size: 17px; color: var(--fg); }
.dialog blockquote { margin: 10px 0; padding: 8px 12px; border-left: 3px solid var(--amber); background: rgba(255, 255, 255, 0.04); }
.actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.bar { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.1); overflow: hidden; margin: 8px 0 4px; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--violet), var(--cyan)); }

/* ---- prototype tray (not part of the product) ---- */
.tray { position: absolute; right: 14px; bottom: 14px; z-index: 40; width: 262px; border: 1px dashed var(--amber); border-radius: 12px; background: rgba(12, 15, 23, 0.96); padding: 10px 12px; font-size: 12px; }
.tray summary { cursor: pointer; font-weight: 700; color: var(--amber); }
.tray fieldset { border: 0; padding: 0; margin: 8px 0 0; }
.tray legend { color: var(--fg-muted); padding: 0; margin-bottom: 4px; }
.pill-row { display: flex; flex-wrap: wrap; gap: 4px; }
.pill { padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line-strong); background: none; cursor: pointer; font-size: 12px; }
.pill[aria-pressed="true"] { background: rgba(143, 123, 255, 0.35); border-color: var(--violet); }
.tray label { display: flex; align-items: center; gap: 6px; margin-top: 6px; }

/* ---- responsive ---- */
@media (max-width: 1100px) { .guardian-layout { grid-template-columns: minmax(0, 1fr); } .side { display: none; } }
@media (max-width: 900px) {
  .app { grid-template-columns: 64px minmax(0, 1fr); }
  .nav-item span, .rail-foot, .brand-text { display: none; }
  .brand { min-width: 0; }
  .nav-item { justify-content: center; padding: 10px 0; }
  .rail { padding: 12px 8px; }
}
@media (max-width: 640px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 52px minmax(0, 1fr) 58px; grid-template-areas: "top" "main" "rail"; }
  .rail { flex-direction: row; border-right: 0; border-top: 1px solid var(--line); padding: 6px 8px; justify-content: space-around; background: var(--bg-raised); }
  .nav-item { width: auto; }
  .topbar { padding: 0 12px; gap: 8px; }
  .status-chip .chip-text { display: none; }
  .profile-text { display: none; }
  .scroll { padding: 16px; }
  .log, .composer-zone { padding-left: 14px; padding-right: 14px; }
  .banner { margin-left: 14px; margin-right: 14px; }
  .tray { width: 220px; bottom: 66px; }
}
</style>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-text">JARVIS</span></div>
    <span class="status-chip" id="overall" role="status"></span>
    <span class="spacer"></span>
    <button class="profile-btn" id="profile" type="button" aria-label="Switch profile (prototype: cycles roles)">
      <span class="avatar" id="avatar">R</span>
      <span class="profile-text"><span id="pname">Robert</span><small id="prole">Administrator</small></span>
    </button>
  </header>
  <nav class="rail" id="rail" aria-label="Views"></nav>
  <main id="main">
    <section class="view" id="v-guardian" aria-label="Guardian">
      <div class="guardian-layout">
        <div class="stage">
          <div class="orb-zone">
            <div class="orb-wrap"><canvas id="orb" aria-hidden="true"></canvas></div>
            <div class="orb-state" id="orbstate" role="status" aria-live="polite"></div>
            <p class="orb-sub" id="orbsub"></p>
          </div>
          <div class="log" id="log" aria-label="Conversation with Guardian" tabindex="0"></div>
          <div>
            <div id="banner"></div>
            <div class="composer-zone">
              <p class="disclosure" id="disclosure"></p>
              <form class="composer" id="composer" autocomplete="off">
                <label class="sr" for="msg">Message JARVIS</label>
                <input id="msg" placeholder="Ask JARVIS anything…" maxlength="4000">
                <button class="claude-link" id="askclaude" type="button" aria-label="Ask Claude about my last message">Ask Claude</button>
                <button class="tool" id="mic" type="button" aria-label="Speak a message" aria-pressed="false"></button>
                <button class="tool send" type="submit" aria-label="Send"></button>
              </form>
            </div>
          </div>
        </div>
        <aside class="side" id="side" aria-label="What is available"></aside>
      </div>
    </section>
    <section class="view" id="v-memory" hidden aria-label="Memory"><div class="scroll" id="c-memory"></div></section>
    <section class="view" id="v-knowledge" hidden aria-label="Knowledge"><div class="scroll" id="c-knowledge"></div></section>
    <section class="view" id="v-agents" hidden aria-label="Agents"><div class="scroll" id="c-agents"></div></section>
    <section class="view" id="v-models" hidden aria-label="AI models"><div class="scroll" id="c-models"></div></section>
    <section class="view" id="v-system" hidden aria-label="System"><div class="scroll" id="c-system"></div></section>
    <div id="dialog"></div>
    <details class="tray" id="tray">
      <summary>Prototype controls</summary>
      <p class="note" style="margin:6px 0 0">Not part of the product. In the real app each state below is driven by a real event.</p>
      <fieldset><legend>Orb state</legend><div class="pill-row" id="t-orb"></div></fieldset>
      <fieldset><legend>Signed in as</legend><div class="pill-row" id="t-role"></div></fieldset>
      <label><input type="checkbox" id="t-reduce"> Reduced motion</label>
      <label><input type="checkbox" id="t-repo" checked> Repository present</label>
      <p class="note" id="fps" style="margin:8px 0 0">Frame rate: measuring…</p>
    </details>
  </main>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var ICONS = {
    chat: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
    memory: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',
    graph: '<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 11l7.6-4M8.2 13l7.6 4"/>',
    agents: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M16 5.5a3 3 0 0 1 0 5.7M18 14.8c2 .6 3.4 2.3 3.4 5.2"/>',
    models: '<rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',
    system: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
    mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
    send: '<path d="M4 12l16-8-6 16-3-7-7-1z"/>',
    check: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',
    half: '<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>',
    minus: '<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>',
    x: '<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>',
    help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
    speak: '<path d="M4 9v6h4l5 4V5L8 9H4zM16.5 8.5a5 5 0 0 1 0 7"/>',
    cloud: '<path d="M7 18a4.5 4.5 0 0 1-.6-9A6 6 0 0 1 18 10a4 4 0 0 1-.5 8z"/>'
  };
  function icon(name) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + '</svg>'; }

  var STATES = { ready: ["check", "Ready"], preparing: ["half", "Preparing"], none: ["minus", "Not available"], offline: ["x", "Offline"], unknown: ["help", "Unknown"] };
  function stateTag(kind, text) { return '<span class="state ' + kind + '">' + icon(STATES[kind][0]) + (text || STATES[kind][1]) + '</span>'; }

  var ROLE_NAMES = { Administrator: "Robert", Adult: "Sam", Child: "Alex", Guest: "Guest" };
  var S = {
    role: "Administrator", view: "guardian", orb: "idle", reduced: false, repo: true, recording: false,
    offer: null, dialog: false, last: "Plan three cheap dinners for this week.",
    msgs: [
      { who: "user", text: "Plan three cheap dinners for this week." },
      { who: "guardian", text: "Here are three ideas that reuse ingredients: a big tray of roast vegetables with chickpeas, a chicken and rice one-pot, and a tomato and lentil pasta. Shall I turn them into a shopping list?", src: "local", model: "qwen3.5:4b" }
    ]
  };
  var canAsk = function () { return S.role === "Administrator" || S.role === "Adult"; };
  var canManage = canAsk;

  /* ---------- navigation ---------- */
  var NAV = [
    ["guardian", "Guardian", "chat", ["Administrator", "Adult", "Child", "Guest"]],
    ["memory", "Memory", "memory", ["Administrator", "Adult", "Child"]],
    ["knowledge", "Knowledge", "graph", ["Administrator", "Adult"]],
    ["agents", "Agents", "agents", ["Administrator", "Adult"]],
    ["models", "AI models", "models", ["Administrator", "Adult"]],
    ["system", "System", "system", ["Administrator", "Adult"]]
  ];
  function renderNav() {
    var items = NAV.filter(function (n) { return n[3].indexOf(S.role) >= 0; });
    if (!items.some(function (n) { return n[0] === S.view; })) S.view = "guardian";
    $("rail").innerHTML = items.map(function (n) {
      return '<button class="nav-item" type="button" data-view="' + n[0] + '"' + (S.view === n[0] ? ' aria-current="page"' : "") + ' aria-label="' + n[1] + '">' + icon(n[2]) + "<span>" + n[1] + "</span></button>";
    }).join("") + '<div class="rail-foot">v0.1.0 · everything stays on this computer unless you ask Claude</div>';
    NAV.forEach(function (n) { $("v-" + n[0]).hidden = n[0] !== S.view; });
  }
  $("rail").addEventListener("click", function (e) {
    var b = e.target.closest("[data-view]"); if (!b) return;
    S.view = b.getAttribute("data-view"); renderAll();
  });

  /* ---------- Guardian view ---------- */
  var ORB_TEXT = {
    idle: ["Ready", "ready", "Answering on this computer with qwen3.5:4b."],
    listening: ["Listening", "ready", "Speak now. Press the microphone again when you finish."],
    thinking: ["Thinking", "preparing", "Working on your question."],
    speaking: ["Speaking", "ready", "Reading the reply aloud."],
    offline: ["Offline", "offline", "JARVIS cannot reach an AI model on this computer."]
  };
  function renderOrbText() {
    var t = ORB_TEXT[S.orb];
    $("orbstate").innerHTML = stateTag(t[1], t[0]);
    $("orbsub").textContent = t[2];
    var kind = S.orb === "offline" ? "offline" : S.orb === "thinking" ? "preparing" : "ready";
    $("overall").innerHTML = STATES && stateTag(kind, S.orb === "offline" ? "AI model offline" : S.orb === "thinking" ? "Working" : "Ready") + '<span class="chip-text muted"> · local model qwen3.5:4b</span>';
  }

    frames++; if (now - fpsClock > 1000) { $("fps").textContent = "Frame rate: " + Math.round(frames * 1000 / (now - fpsClock)) + " fps in the " + S.orb + " state (budget: active 60, idle 30, offline 10)"; frames = 0; fpsClock = now; }
  }
  window.addEventListener("resize", function () { resize(); if (reduced()) drawOrb(0, true); });
  if (window.ResizeObserver) new ResizeObserver(function () { resize(); if (reduced()) drawOrb(0, true); }).observe(canvas);
  document.addEventListener("visibilitychange", function () { last = 0; });

  renderAll(); resize(); orbTarget();
  if (reduced()) { $("fps").textContent = "Frame rate: animation paused (reduced motion)"; }
  requestAnimationFrame(loop);
})();
</script>
